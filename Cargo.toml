[package]
name = "nerv"
version = "0.1.0"
edition = "2021"
description = "Evangelion-style live board of herdr agents, system telemetry, power and sound"
license = "MIT"

[[bin]]
name = "nerv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
libc = "0.2"
# hub
ratatui = "0.30"
crossterm = "0.29"
# tv
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
femtovg = { version = "0.27", features = ["glutin"] }
fontdb = "0.24"
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
